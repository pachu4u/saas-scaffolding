name: STACKIT Images

# Builds and pushes the web/workers images actually used by the STACKIT
# deployment to STACKIT's own Harbor registry. Distinct from release.yml
# (which targets GHCR + a Helm/Kubernetes staging-prod pipeline that predates
# this docker-compose + STACKIT VM architecture and isn't currently used by
# anything) -- this is the pipeline the running deployment actually needs.
#
# Build args below are placeholders, not real secrets: both Dockerfiles only
# use them for Next.js's build-time env-schema validation in an intermediate
# `builder` stage that gets discarded -- the final runner stage never copies
# these values forward (confirmed by reading both Dockerfiles: the runner
# stage only sets NODE_ENV/PORT/HOSTNAME). Real values are injected at
# container runtime via docker-compose's env_file, same as before.

on:
  push:
    branches: [main, infra/stackit-domain-config]
  workflow_dispatch: {}

env:
  REGISTRY: registry.onstackit.cloud
  PLACEHOLDER_BUILD_ARGS: |
    NEXT_PUBLIC_APP_URL=https://placeholder.invalid
    DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
    DATABASE_URL_MIGRATOR=postgresql://placeholder:placeholder@localhost:5432/placeholder
    KEYCLOAK_ISSUER=https://placeholder.invalid/realms/placeholder
    KEYCLOAK_CLIENT_ID=placeholder
    KEYCLOAK_CLIENT_SECRET=placeholder
    AUTH_SECRET=00000000000000000000000000000000
    AUTH_URL=https://placeholder.invalid
    REDIS_URL=redis://localhost:6379
    PLATFORM_INTERNAL_SECRET=placeholder-secret-value

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
            image: registry.onstackit.cloud/saas-platform/web
          - name: workers
            dockerfile: infra/docker/workers.Dockerfile
            image: registry.onstackit.cloud/saas-platform/workers

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.STACKIT_HARBOR_USERNAME }}
          password: ${{ secrets.STACKIT_HARBOR_PASSWORD }}

      - name: Build & push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ env.PLACEHOLDER_BUILD_ARGS }}
