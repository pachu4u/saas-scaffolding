groups:
  - name: platform
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.instance }} is failing'
          description: 'Probe from the VM ({{ $labels.job }}) has failed for 3 minutes.'

      - alert: TlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: 'TLS certificate for {{ $labels.instance }} expires in {{ $value | humanize }} days'

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) > 0.80
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Root disk is {{ $value | humanizePercentage }} full on the app VM'

      - alert: MemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'App VM memory use is {{ $value | humanizePercentage }}'

      - alert: HighLoad
        expr: node_load15 / count(node_cpu_seconds_total{mode="idle"}) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'App VM 15-minute load is {{ $value | humanizePercentage }} of CPU count'

      - alert: BackupMissing
        expr: time() - saas_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'No successful off-VM backup for {{ $value | humanizeDuration }}'
          description: 'Check `journalctl -u saas-backup` on the app VM.'

      - alert: BackupHeartbeatAbsent
        expr: absent(saas_backup_last_success_timestamp_seconds)
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: 'Backup heartbeat metric is missing (saas-backup never ran or node-exporter textfile is broken)'

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})'

      - alert: VmRebootRequired
        expr: node_reboot_required > 0
        for: 7d
        labels: { severity: info }
        annotations:
          summary: 'App VM has needed a reboot for over a week (pending security updates)'
